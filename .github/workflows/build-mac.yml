# Builds the Mac installer on GitHub's free Mac machines.
#
# Runs on every push and can be started by hand (Actions tab -> "Build Mac
# installer" -> Run workflow). When it finishes, download the installer from
# the run's "Artifacts" section. Pushing a tag like v0.2.0 also publishes it on
# the repository's Releases page.

name: Build Mac installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases for tags

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60

    env:
      # Optional code signing + notarization. Leave these secrets unset for an
      # ad-hoc signed installer (macOS will ask you to approve it once).
      MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
      MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      MAC_APP_SIGN_IDENTITY: ${{ secrets.MAC_APP_SIGN_IDENTITY }}
      MAC_INSTALLER_SIGN_IDENTITY: ${{ secrets.MAC_INSTALLER_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.2.0" >> "$GITHUB_ENV"
          fi

      - name: Install Ninja
        run: brew install ninja

      # Reuse the compiled plug-ins when the source code hasn't changed.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: mac-build-${{ hashFiles('CMakeLists.txt', 'Source/**', 'Tests/**') }}

      - name: Configure (universal binary, Apple Silicon + Intel)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build plug-ins
        run: cmake --build build --parallel

      - name: Save build cache
        uses: actions/cache/save@v4
        with:
          path: build
          key: mac-build-${{ hashFiles('CMakeLists.txt', 'Source/**', 'Tests/**') }}
        continue-on-error: true

      - name: Run detector test
        run: ./build/EngineTest

      - name: Validate plug-ins with pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          status=0
          for target in BandTrigger BandTriggerInst; do
            for p in build/${target}_artefacts/Release/VST3/*.vst3; do
              codesign --force --deep --sign - "$p"
              echo "=== $p"
              set +e
              "$PV" --strictness-level 5 --validate "$p" > "pv-$target.log" 2>&1
              rc=$?
              set -e
              cat "pv-$target.log"
              if [[ $rc -ne 0 ]]; then
                status=1
                msg=$(grep -E "FAILED|Error|error|!!!|Starting test|Unable|could not|crash" "pv-$target.log" | tail -n 30 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
                echo "::error title=pluginval failed for $target::${msg}"
              else
                echo "::notice title=pluginval passed for $target::All tests passed at strictness 5"
              fi
            done
          done
          exit $status

      - name: Import signing certificates (optional)
        if: ${{ env.MAC_CERTS_P12 != '' }}
        run: |
          echo "$MAC_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$MAC_CERTS_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

      - name: Make installer
        run: |
          chmod +x packaging/mac/make_installer.sh
          set +e
          bash -x ./packaging/mac/make_installer.sh build > installer.log 2>&1
          status=$?
          cat installer.log
          if [[ $status -ne 0 ]]; then
            # Surface the last lines as an annotation, readable from the run summary.
            msg=$(tail -n 40 installer.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Installer step failed::${msg}"
          fi
          exit $status

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BandTrigger-mac-installer
          path: dist/*.pkg
          if-no-files-found: error

      # A copy with a fixed name, so this link always gets the newest release:
      # https://github.com/<owner>/<repo>/releases/latest/download/BandTrigger-mac.pkg
      - name: Add fixed-name copy for "latest" download links (tags only)
        if: ${{ github.ref_type == 'tag' }}
        run: cp dist/BandTrigger-*-mac.pkg dist/BandTrigger-mac.pkg

      - name: Publish release (tags only)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          name: BandTrigger ${{ env.VERSION }}
          files: dist/*.pkg
          body: |
            8-band drum-hit-to-MIDI trigger for macOS 11+ (Apple Silicon and Intel). VST3, AU and Standalone.

            **Install:** download `BandTrigger-mac.pkg` and double-click it. The installer isn't notarized by Apple yet, so the first time macOS blocks it: open System Settings, then Privacy & Security, scroll down and click **Open Anyway**.

            Setup in Ableton Live and other DAWs: see the README.
